version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: wmanagment_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wmanagment
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/posgresql/data

volumes:
  pgdata:
